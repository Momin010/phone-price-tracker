<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phone Price Tracker API</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #111; line-height: 1.5; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    .ep { border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
    .m { font-weight: 700; color: #0a7; }
    h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>Phone Price Tracker — API</h1>
  <p>Backend service. Daily phone-part shop &amp; buyback prices for the dashboard.</p>
  <div class="ep"><span class="m">GET</span> <code>/api/health</code> — service status</div>
  <div class="ep"><span class="m">GET</span> <code>/api/prices</code> — latest prices (needs header <code>x-api-key</code>)<br/>
    <small>filters: <code>?type=shop|buyback</code> · <code>?country=FI</code> · <code>?sku=...</code></small></div>
</body>
</html>
